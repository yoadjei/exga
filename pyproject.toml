[project]
name = "exga"
version = "0.1.0"
description = "Extract fields from research-paper PDFs with an LLM and accept values only under a certified error-rate bound."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yaw Osei Adjei" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.4.6",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.28.2,<2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.14.6",
    "scipy>=1.17.1",
    "streamlit>=1.40",
    "typer>=0.15",
]

[project.scripts]
exga = "exga.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "scipy-stubs>=1.17.1.5",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# code blocks in markdown are illustrative snippets in the owner's documents, not project code;
# formatting them would rewrite the specification
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # likely bugs
    "UP",           # modern syntax for the target python
    "SIM", "C4", "RET", "PIE",  # simpler equivalent code
    "N",            # pep 8 naming
    "PT",           # pytest conventions
    "PTH",          # pathlib instead of os.path
    "BLE",          # no blind `except Exception`
    "T20",          # no print; use logging
    "ARG",          # unused arguments
    "PLR2004",      # magic numbers belong in Settings
    "D100", "D101", "D102", "D103", "D104", "D106",  # public modules, classes and functions have docstrings
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# tests document themselves through their names, and literal expected values are the point of a test
"tests/**" = ["D", "PLR2004"]
# scripts are command-line programs: printing is their user output
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["exga", "tests", "scripts"]
plugins = ["pydantic.mypy"]
# PyMuPDF's own annotations are incomplete; only calls into it are exempt from the
# untyped-call check, so our code around it stays fully typed
untyped_calls_exclude = ["pymupdf"]

[tool.pydantic-mypy]
# type-check model constructor calls against the declared fields
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["exga"]

[tool.coverage.report]
show_missing = true
